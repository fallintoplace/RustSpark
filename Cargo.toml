[package]
name = "rustspark"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Experimental Spark-inspired SQL engine in Rust"
repository = "https://github.com/fallintoplace/RustSpark"
license = "Apache-2.0"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
datafusion = { version = "55.1.0", default-features = false, features = ["sql", "parquet"] }
futures = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }


[profile.dev]
debug = 0

[profile.test]
debug = 0
