[package]
name = "rustspark"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Experimental native Rust SQL query engine"
repository = "https://github.com/fallintoplace/RustSpark"
license = "Apache-2.0"
publish = false
default-run = "rustspark"
autobins = false
# The old DataFusion integration suite targets a retired public API.
# Native CLI regression coverage is explicitly listed below.
autotests = false

[dependencies]
rustspark-native = { path = "native-engine" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "rustspark"
path = "native-engine/src/main.rs"

[[test]]
name = "native_cli_contract"
path = "tests/native_cli_contract.rs"

[profile.dev]
debug = 0

[profile.test]
debug = 0
