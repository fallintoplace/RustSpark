[package]
name = "rustspark-ballista-remote"
version = "0.1.0"
edition = "2024"
publish = false

[features]
standalone = ["ballista/standalone"]

[[example]]
name = "standalone"
required-features = ["standalone"]

[dependencies]
ballista = { version = "=55.0.0", default-features = false }
datafusion = { version = "=55.1.0", default-features = false, features = ["sql", "parquet"] }
rustspark = { path = "../.." }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
