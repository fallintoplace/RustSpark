[package]
name = "rustspark-ballista-remote"
version = "0.1.0"
edition = "2024"
publish = false

# This is intentionally a separate Cargo project. Ballista dependencies must
# not enlarge the default RustSpark CLI or change its existing Cargo.lock.
[features]
# Keep the default remote-only client small. Opt in to embedded services.
standalone = ["ballista/standalone"]

[[example]]
name = "standalone"
required-features = ["standalone"]

[dependencies]
ballista = { version = "=55.0.0", default-features = false }
datafusion = { version = "=55.1.0", default-features = false, features = ["sql", "parquet"] }
futures = "0.3"
rustspark = { path = "../.." }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
url = "2"
