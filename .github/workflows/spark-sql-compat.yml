name: Spark SQL compatibility harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_spark_compat.py'
      - run: python3 -m unittest discover -s scripts -p 'test_spark_typed_compat.py'
      - run: python3 -m unittest discover -s scripts -p 'test_release_smoke.py'
