name: RustSpark query latency

on:
  pull_request:
    paths:
      - scripts/bench_query_latency.py
      - src/sql_results.rs
      - src/cli/query.rs
      - scripts/test_bench_query_latency.py
      - scripts/bench_json_valid_perf.py
      - scripts/test_bench_json_valid_perf.py
      - src/sql_compat/json.rs
      - Cargo.toml
      - Cargo.lock
      - benchmarks/README.md
      - .github/workflows/query-latency.yml
  workflow_dispatch:
    inputs:
      rows:
        description: Number of deterministic CSV rows
        required: true
        default: '100000'
      repeats:
        description: Measured runs per query
        required: true
        default: '3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  query-latency:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate query suite
        run: python3 -m unittest discover -s scripts -p 'test_bench_query_latency.py'
      - name: Check out baseline source for PR comparison
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Validate paired benchmark harness
        if: github.event_name == 'pull_request'
        run: python3 -m unittest discover -s scripts -p 'test_bench_json_valid_perf.py'
      - name: Build baseline release binary
        if: github.event_name == 'pull_request'
        run: |
          cargo build --release --locked --manifest-path baseline/Cargo.toml --target-dir target
          cp target/release/rustspark "$RUNNER_TEMP/rustspark-baseline"
      - name: Build release binary
        run: cargo build --release --locked
      - name: Measure query latencies
        run: |
          python3 scripts/bench_query_latency.py \
            --binary ./target/release/rustspark \
            --rows "${{ inputs.rows || '100000' }}" \
            --repeat "${{ inputs.repeats || '3' }}" --warmup 1 \
            --json-out benchmarks/results/query-latency.json \
            --markdown-out benchmarks/results/query-latency.md
      - name: Compare JSON_VALID base and PR release binaries
        if: github.event_name == 'pull_request'
        run: |
          python3 scripts/bench_json_valid_perf.py \
            --baseline-binary "$RUNNER_TEMP/rustspark-baseline" \
            --candidate-binary "./target/release/rustspark" \
            --rows 120000 --warmup 2 --repeat 7 \
            --json-out "$RUNNER_TEMP/json-valid-perf.json" \
            --markdown-out "$RUNNER_TEMP/json-valid-perf.md"
      - name: Publish JSON_VALID comparison
        if: always() && github.event_name == 'pull_request'
        run: |
          if [ -f "$RUNNER_TEMP/json-valid-perf.md" ]; then
            cat "$RUNNER_TEMP/json-valid-perf.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'JSON_VALID comparison unavailable; inspect earlier steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always() && github.event_name == 'pull_request'
        with:
          name: rustspark-json-valid-base-vs-pr
          path: |
            ${{ runner.temp }}/json-valid-perf.json
            ${{ runner.temp }}/json-valid-perf.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish query timings
        if: always()
        run: |
          if [ -f benchmarks/results/query-latency.md ]; then
            cat benchmarks/results/query-latency.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Query latency report unavailable; see earlier job steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rustspark-query-latencies
          path: |
            benchmarks/results/query-latency.json
            benchmarks/results/query-latency.md
          if-no-files-found: warn
          retention-days: 90
