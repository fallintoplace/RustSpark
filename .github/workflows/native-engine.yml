name: Native engine

on:
  pull_request:
    paths:
      - 'native-engine/**'
      - '.github/workflows/native-engine.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    name: Build and test native engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native-engine
      - run: cargo test --manifest-path native-engine/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path native-engine/Cargo.toml --all-targets -- -D warnings
