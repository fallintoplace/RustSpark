name: Rust native

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify native dependency graph
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_native_dependencies.py
      - name: Test native engine
        run: cargo test --manifest-path native-engine/Cargo.toml --all-targets
      - name: Test native default binary
        run: cargo test --all-targets
      - name: Lint native engine
        run: cargo clippy --manifest-path native-engine/Cargo.toml --all-targets -- -D warnings
      - name: Lint native default binary
        run: cargo clippy --all-targets -- -D warnings
