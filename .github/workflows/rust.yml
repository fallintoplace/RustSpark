name: Rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A fast follow-up merge must not cancel the only running check for main.
  # Keep canceling outdated PR runs; GitHub retains the newest pending main run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  tests:
    name: Linux integration shard ${{ matrix.shard }}/8
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      CARGO_BUILD_JOBS: 4
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run library, binary, and integration tests by executable
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          cargo test --locked --lib
          if [[ "$SHARD" == "0" ]]; then
            cargo test --locked --bins
          fi
          mapfile -t tests < <(find tests -maxdepth 1 -type f -name '*.rs' -printf '%f\n' | sed 's/\.rs$//' | sort)
          for i in "${!tests[@]}"; do
            if (( i % 8 == SHARD )); then
              cargo test --locked --test "${tests[$i]}"
            fi
          done

  smoke:
    name: CLI smoke
    needs: format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build CLI for end-to-end smoke checks
        run: cargo build --locked --bin rustspark
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exercise CLI, catalog persistence, and file formats
        run: python3 scripts/release_smoke.py --binary ./target/debug/rustspark

  compatibility:
    needs: format
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MSRV (Rust 1.95)
            os: ubuntu-latest
            toolchain: '1.95'
            build_jobs: 4
          - name: Windows (stable)
            os: windows-latest
            toolchain: stable
            build_jobs: 2
          - name: macOS (stable)
            os: macos-15
            toolchain: stable
            build_jobs: 2
    env:
      CARGO_BUILD_JOBS: ${{ matrix.build_jobs }}
      # Limit debug artifact size on disk-heavy multi-target test jobs.
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_STRIP: symbols
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets --locked
