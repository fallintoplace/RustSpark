name: Rust native

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'native-engine/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'tests/native_cli_contract.rs'
      - 'scripts/check_native_dependencies.py'
      - '.github/workflows/rust.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

jobs:
  main-check:
    name: Latest main compile check
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify native dependency graph
        run: python3 scripts/check_native_dependencies.py
      - name: Check root targets
        run: cargo check --all-targets
      - name: Check native engine targets
        run: cargo check --manifest-path native-engine/Cargo.toml --all-targets
      # The full native suite still has unrelated failures. Keep a focused
      # word-boundary regression gate on pull requests and main pushes.
      - name: Test native text word boundaries
        run: |
          cargo test --manifest-path native-engine/Cargo.toml --lib builtin::char_length::
          cargo test --manifest-path native-engine/Cargo.toml --lib builtin::initcap::
      - name: Test native CLI contract
        run: cargo test --test native_cli_contract

  native:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    name: Native Rust on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Verify native dependency graph
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/check_native_dependencies.py
      - name: Test native engine
        run: cargo test --manifest-path native-engine/Cargo.toml --all-targets
      - name: Test native default binary
        run: cargo test --all-targets
      - name: Lint native engine
        run: cargo clippy --manifest-path native-engine/Cargo.toml --all-targets -- -D warnings
      - name: Lint native default binary
        run: cargo clippy --all-targets -- -D warnings
