name: Compare warm local SQL sessions

on:
  workflow_dispatch:
    inputs:
      rows:
        description: Rows in deterministic CSV input
        required: true
        default: '100000'
      repeats:
        description: Timed runs per workload
        required: true
        default: '5'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo build --release --locked
      - run: python3 -m pip install 'pyspark>=4,<5'
      - name: Compare warm SQL sessions
        run: |
          python3 scripts/bench_warm_compare.py --binary ./target/release/rustspark \
            --engines rustspark spark --rows "${{ inputs.rows }}" \
            --repeat "${{ inputs.repeats }}" --warmup 1 --target-partitions 2 \
            --json-out benchmarks/warm-comparison.json
      - name: Render checked Markdown comparison
        run: python3 scripts/bench_report.py benchmarks/warm-comparison.json --output benchmarks/reports/warm.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-comparison
          path: |
            benchmarks/warm-comparison.json
            benchmarks/reports/warm.md
          if-no-files-found: warn
