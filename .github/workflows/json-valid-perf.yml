name: JSON_VALID base vs PR performance

on:
  pull_request:
    paths:
      - src/sql_compat/json.rs
      - Cargo.toml
      - Cargo.lock
      - scripts/bench_json_valid_perf.py
      - scripts/test_bench_json_valid_perf.py
      - .github/workflows/json-valid-perf.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  json-valid-comparison:
    name: JSON_VALID performance comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: ${{ runner.temp }}/rustspark-perf-target
    steps:
      - name: Check out base revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - name: Check out PR revision
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test paired comparison harness
        run: python3 -m unittest discover -s candidate/scripts -p 'test_bench_json_valid_perf.py'
      - name: Build baseline in release mode
        run: |
          cargo build --release --locked --manifest-path baseline/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/rustspark" "$RUNNER_TEMP/rustspark-baseline"
      - name: Build PR in release mode
        run: |
          cargo build --release --locked --manifest-path candidate/Cargo.toml
          cp "$CARGO_TARGET_DIR/release/rustspark" "$RUNNER_TEMP/rustspark-candidate"
      - name: Compare JSON_VALID latency on the same runner
        run: |
          python3 candidate/scripts/bench_json_valid_perf.py \
            --baseline-binary "$RUNNER_TEMP/rustspark-baseline" \
            --candidate-binary "$RUNNER_TEMP/rustspark-candidate" \
            --rows 120000 --warmup 2 --repeat 7 \
            --json-out "$RUNNER_TEMP/json-valid-perf.json" \
            --markdown-out "$RUNNER_TEMP/json-valid-perf.md"
      - name: Publish comparison
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/json-valid-perf.md" ]; then
            cat "$RUNNER_TEMP/json-valid-perf.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Performance comparison unavailable; inspect preceding steps.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rustspark-json-valid-base-vs-pr
          path: |
            ${{ runner.temp }}/json-valid-perf.json
            ${{ runner.temp }}/json-valid-perf.md
          if-no-files-found: warn
          retention-days: 30
