name: Spark SQL typed differential

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 3'

permissions:
  contents: read

jobs:
  compare-with-spark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: cargo build --locked
      - run: python3 -m pip install 'pyspark>=4,<5'
      - name: Compare typed table-backed SQL with real Spark
        run: python3 scripts/spark_typed_compat.py --rustspark ./target/debug/rustspark --json-out reports/spark-typed.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spark-typed-differential
          path: reports/spark-typed.json
          if-no-files-found: warn
