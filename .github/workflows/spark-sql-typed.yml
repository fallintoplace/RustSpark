name: Spark SQL typed differential

on:
  pull_request:
    paths:
      - '.github/workflows/spark-sql-typed.yml'
      - 'scripts/spark_compat.py'
      - 'scripts/spark_typed_compat.py'
      - 'scripts/test_spark_compat.py'
      - 'scripts/test_spark_typed_compat.py'
      - 'tests/compatibility/**'
      - 'src/sql_compat/**'
      - 'src/sql_results.rs'
      - 'src/sources.rs'
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 3'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - name: Package RustSpark binary
        run: tar -czf rustspark-typed.tar.gz -C target/debug rustspark
      - uses: actions/upload-artifact@v7
        with:
          name: rustspark-typed-binary
          path: rustspark-typed.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  compare-with-spark:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        input_format: [csv, parquet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: rustspark-typed-binary
      - name: Extract RustSpark binary
        run: mkdir -p target/debug && tar -xzf rustspark-typed.tar.gz -C target/debug
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 -m pip install 'pyspark>=4,<5'
      - name: Compare typed table-backed SQL with real Spark
        run: |
          python3 scripts/spark_typed_compat.py --rustspark ./target/debug/rustspark \
            --input-format "${{ matrix.input_format }}" --check-nullability \
            --json-out "reports/spark-typed-${{ matrix.input_format }}.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spark-typed-differential-${{ matrix.input_format }}
          path: reports/spark-typed-${{ matrix.input_format }}.json
          if-no-files-found: warn
