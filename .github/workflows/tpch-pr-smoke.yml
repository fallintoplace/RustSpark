name: TPC-H PR correctness smoke

on:
  pull_request:
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'scripts/tpch_prepare.py'
      - 'scripts/tpch_run.py'
      - 'scripts/bench_tpch_verify.py'
      - '.github/workflows/tpch-pr-smoke.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tpch-correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'duckdb>=1.3,<2'
      - run: cargo build --locked --bin rustspark
      - name: Generate deterministic TPC-H fixture
        run: python3 scripts/tpch_prepare.py --scale-factor 0.01 --output "$RUNNER_TEMP/tpch"
      - name: Run representative scans, joins and aggregations
        run: |
          python3 scripts/tpch_run.py --binary target/debug/rustspark \
            --queries-dir "$RUNNER_TEMP/tpch/queries" \
            --parquet-dir "$RUNNER_TEMP/tpch/data" \
            --query-ids 1 3 6 14 --repeat 1 --warmup 0 \
            --timeout 120 --json-out "$RUNNER_TEMP/tpch-pr-results.json"
      - name: Compare every selected result to DuckDB
        run: |
          python3 scripts/bench_tpch_verify.py --binary target/debug/rustspark \
            --queries-dir "$RUNNER_TEMP/tpch/queries" \
            --parquet-dir "$RUNNER_TEMP/tpch/data" \
            --query-ids 1 3 6 14 --timeout 120 --target-partitions 2 \
            --json-out "$RUNNER_TEMP/tpch-pr-verification.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tpch-pr-correctness
          path: |
            ${{ runner.temp }}/tpch-pr-results.json
            ${{ runner.temp }}/tpch-pr-verification.json
          if-no-files-found: warn
