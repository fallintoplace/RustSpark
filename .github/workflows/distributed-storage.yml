name: Replicated storage

on:
  push:
    branches: [main]
    paths:
      - 'src/distributed_storage/**'
      - 'src/sources.rs'
      - 'tests/distributed_snapshot_parquet.rs'
      - 'integrations/ballista/src/replicated_inputs.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/distributed-storage.yml'
  pull_request:
    paths:
      - 'src/distributed_storage/**'
      - 'src/sources.rs'
      - 'tests/distributed_snapshot_parquet.rs'
      - 'integrations/ballista/src/replicated_inputs.rs'
      - 'src/lib.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/distributed-storage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib distributed_storage
      - run: cargo test --locked --test distributed_snapshot_parquet
