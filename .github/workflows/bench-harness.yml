name: SQL benchmark harness

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p 'test_bench_rustspark.py'
      - run: python3 -m unittest discover -s scripts -p 'test_bench_compare.py'
      - run: python3 -m unittest discover -s scripts -p 'test_bench_warm_compare.py'
      - run: python3 -m unittest discover -s scripts -p 'test_bench_report.py'
