name: Release binaries

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - docs/releasing.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify tagged version and main branch ancestry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(grep -m1 '^version = "' Cargo.toml | cut -d '"' -f 2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to a commit on main"
            exit 1
          fi
      - name: Require successful Rust CI for tagged commit
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          successful_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/rust.yml/runs" \
            -f "head_sha=${GITHUB_SHA}" -f "branch=main" -f "event=push" \
            -f "per_page=100" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .event == \"push\" and .conclusion == \"success\")] | length")
          if [ "$successful_runs" -lt 1 ]; then
            echo "::error::The tagged commit requires a completed successful main Rust CI run."
            exit 1
          fi
      - name: Check redistribution license on tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ ! -f LICENSE ]; then
            echo "::error::Add a repository LICENSE before distributing RustSpark binaries."
            exit 1
          fi

  storage-qualification:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Qualify local storage and V1 CLI workflows
        run: >-
          cargo test --locked
          --test cli_insert_recovery
          --test cli_database_lock
          --test cli_catalog_recovery
          --test cli_database_backup
          --test v1_workflows

  build:
    needs: [verify, storage-qualification]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            id: linux
            binary: ./target/release/rustspark
          - os: windows-latest
            id: windows
            binary: ./target/release/rustspark.exe
          - os: macos-15
            id: macos
            binary: ./target/release/rustspark
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build locked release executable
        run: cargo build --release --locked --bin rustspark
      - name: Smoke-test the built executable
        shell: bash
        run: |
          result=$("${{ matrix.binary }}" --sql "SELECT 42 AS answer" --stdout-format json)
          test "$result" = '{"answer":42}'
      - name: Cross-process SQL smoke test
        run: python scripts/release_smoke.py --binary ${{ matrix.binary }}
      - name: Unit-test archive verifier
        run: python -m unittest discover -s scripts -p 'test_verify_release_archive.py'
      - name: Package Linux executable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf dist/rustspark-linux-x86_64.tar.gz -C target/release rustspark -C "$GITHUB_WORKSPACE" README.md LICENSE
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path target/release/rustspark.exe, README.md, LICENSE -DestinationPath dist/rustspark-windows-x86_64.zip -CompressionLevel Optimal
      - name: Package macOS arm64 executable
        if: runner.os == 'macOS'
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          mkdir -p dist
          tar -czf dist/rustspark-macos-arm64.tar.gz -C target/release rustspark -C "$GITHUB_WORKSPACE" README.md LICENSE
      - name: Verify final archive and smoke-test extracted binary
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)
              python scripts/verify_release_archive.py --archive dist/rustspark-linux-x86_64.tar.gz --binary "${{ matrix.binary }}"
              ;;
            Windows)
              python scripts/verify_release_archive.py --archive dist/rustspark-windows-x86_64.zip --binary "${{ matrix.binary }}"
              ;;
            macOS)
              python scripts/verify_release_archive.py --archive dist/rustspark-macos-arm64.tar.gz --binary "${{ matrix.binary }}"
              ;;
            *)
              exit 1
              ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Write checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum rustspark-linux-x86_64.tar.gz rustspark-windows-x86_64.zip rustspark-macos-arm64.tar.gz > SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
