name: Rust dependency security audit

on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec advisory audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install RustSec cargo-audit
        run: cargo install --locked cargo-audit
      - name: Audit Cargo.lock against RustSec advisories
        run: cargo audit --json > rustsec-audit.json
      - name: Upload audit results for triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rustsec-audit-report
          path: rustsec-audit.json
          if-no-files-found: ignore
          retention-days: 30
