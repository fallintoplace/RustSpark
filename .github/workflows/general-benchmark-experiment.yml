name: General SQL benchmark experiment
on:
  push:
    branches:
      - bench/general-sweep-20261027-1955

permissions:
  contents: read

jobs:
  general-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install comparison engines
        run: python3 -m pip install 'duckdb>=1,<2' 'pyspark>=4,<5'
      - name: Cold SQL at 100k and 1m rows
        run: |
          mkdir -p benchmarks/reports
          python3 scripts/bench_rustspark.py --rows 100000 --repeat 5 --warmup 1 --json-out benchmarks/reports/general-cold-100k.json > /dev/null
          python3 scripts/bench_rustspark.py --rows 1000000 --repeat 5 --warmup 1 --json-out benchmarks/reports/general-cold-1m.json > /dev/null
      - name: Cold comparison with DuckDB
        run: |
          python3 scripts/bench_compare.py --engines rustspark duckdb --rows 100000 --repeat 5 --warmup 1 --json-out benchmarks/reports/general-compare-100k.json > /dev/null
      - name: Warm comparison with DuckDB and Spark
        continue-on-error: true
        run: |
          python3 scripts/bench_warm_compare.py --engines rustspark duckdb spark --rows 100000 --repeat 5 --warmup 1 --timeout 300 --target-partitions 2 --json-out benchmarks/reports/general-warm-100k.json > /dev/null
      - name: Parquet TPC-H query coverage
        continue-on-error: true
        run: |
          python3 scripts/tpch_prepare.py --scale-factor 0.01 --output benchmarks/reports/tpch-fixture
          python3 scripts/tpch_run.py --queries-dir benchmarks/reports/tpch-fixture/queries --parquet-dir benchmarks/reports/tpch-fixture/data --query-ids 1 3 5 6 10 12 14 17 19 22 --repeat 2 --warmup 1 --timeout 60 --json-out benchmarks/reports/general-tpch.json > /dev/null
      - name: Print compact results
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("benchmarks/reports")
          for label, filename in (
              ("COLD_100K", "general-cold-100k.json"),
              ("COLD_1M", "general-cold-1m.json"),
              ("COLD_DUCKDB", "general-compare-100k.json"),
              ("WARM_ENGINES", "general-warm-100k.json"),
              ("TPC_H", "general-tpch.json"),
          ):
              f=p/filename
              print("BENCHMARK",label,"missing" if not f.exists() else "ok",flush=True)
              if not f.exists(): continue
              d=json.loads(f.read_text())
              if label.startswith("COLD_") and "workloads" in d and isinstance(d["workloads"],list):
                  for w in d["workloads"]:
                      print("RESULT",label,w["name"],w["median_ms"],w["p95_ms"],flush=True)
              elif label == "TPC_H":
                  for w in d.get("results",[]):
                      print("RESULT",label,w["id"],w["status"],w.get("median_ms"),w.get("error","")[:120],flush=True)
              else:
                  for engine, workloads in d.get("results",{}).items():
                      for name, data in workloads.items():
                          print("RESULT",label,engine,name,data["median_ms"],data["p95_ms"],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rustspark-general-benchmark
          path: benchmarks/reports/*.json
          if-no-files-found: warn
