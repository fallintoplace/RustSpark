name: Ballista standalone SQL smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/ballista/**'
      - 'scripts/ballista_smoke.py'
      - 'scripts/test_ballista_smoke.py'
      - '.github/workflows/ballista-standalone-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts -p test_ballista_smoke.py
      - run: cargo test --manifest-path integrations/ballista/Cargo.toml
      - run: python3 scripts/ballista_smoke.py --mode standalone --timeout 900
