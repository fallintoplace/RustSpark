name: Ballista standalone SQL smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'integrations/ballista/**'
      - 'scripts/ballista_smoke.py'
      - 'scripts/test_ballista_smoke.py'
      - '.github/workflows/ballista-standalone-smoke.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python3 scripts/quality.py test --suite bench
      - name: Test default remote-client configuration
        run: cargo test --all-targets --manifest-path integrations/ballista/Cargo.toml
      - name: Test the standalone feature configuration
        run: cargo test --all-targets --manifest-path integrations/ballista/Cargo.toml --features standalone
      - run: python3 scripts/ballista_smoke.py --mode standalone --timeout 900
