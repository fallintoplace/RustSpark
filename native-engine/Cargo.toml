[package]
name = "rustspark-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "DataFusion-free experimental query engine for RustSpark"
license = "Apache-2.0"
publish = false

# Independent native RustSpark engine with no DataFusion or Ballista dependency.
[workspace]

[dependencies]
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
arrow-ipc = "60.0.0"
parquet = "60.0.0"
serde_json = "1"
regex = "1"
