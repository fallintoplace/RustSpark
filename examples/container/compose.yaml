services:
  query:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: rustspark:local
    user: "10001:10001"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    volumes:
      - ../../tests/fixtures:/data:ro
    command:
      - --csv
      - /data/sales.csv
      - --sql
      - SELECT city, SUM(amount) AS total FROM data GROUP BY city ORDER BY city
      - --stdout-format
      - json-array
    restart: "no"
    mem_limit: 1g
    cpus: 2
